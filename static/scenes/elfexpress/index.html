<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title msgid="scene_elfexpress"></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
<style>
:root{--bg:#2B7FD9;--panel:#FFFFFF;--edge:#C1E8ED;
--ink:#1D1D1D;--muted:#74797E;--blue:#3399FF;--amber:#E7AD03;--rose:#FF3333;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden;
font-family:"Google Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
color:var(--ink);overscroll-behavior:none;touch-action:none}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.screen{position:absolute;inset:0;display:none;place-items:center;
background:rgba(31,78,156,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
padding:52px 16px 12px;text-align:center;z-index:10;transition:opacity .3s ease}
.screen.on{display:grid}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:20px;
box-shadow:0 20px 44px rgba(11,40,80,.38);
padding:18px 24px;max-width:480px;width:100%;max-height:min(calc(100vh - 64px),680px);overflow-y:auto;position:relative}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
background:linear-gradient(90deg,#FF3333,#FFE14D,#32A658,#3399FF)}
h1{margin:0 0 4px;font-family:"Lobster",cursive;font-size:38px;font-weight:400;
letter-spacing:0;color:#FF3333;line-height:1.1}
.sub{margin:0 0 12px;color:#1B69C1;font-size:14px;font-weight:600}
button{font-family:inherit;font-size:15px;font-weight:600;color:#FFF;
background:#FF3333;border:1px solid #D92626;
border-radius:10px;padding:12px 28px;cursor:pointer;margin:6px 4px;
transition:all .2s ease;box-shadow:0 4px 12px rgba(181,20,26,.32)}
button:hover{transform:translateY(-1px);background:#D92626}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.ghost{background:#FFFFFF;border:1.5px solid #D8DDE2;color:#41474C;box-shadow:none}
.tut-skip-btn{position:absolute;bottom:18px;left:18px;z-index:8;display:none;
min-height:44px;align-items:center;justify-content:center;
border:2px solid #3399FF;border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:700;
color:#1D1D1D;background:#FFFFFF;box-shadow:0 4px 12px rgba(11,40,80,.28);margin:0}
.tut-skip-btn.on{display:inline-flex}
.vis-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){button{transition:none}button:hover{transform:none}}
.elf-card{padding:8px;margin:0;width:88px;height:120px;display:flex;flex-direction:column;background:rgba(30,41,59,.7);border:2px solid rgba(255,255,255,.12);box-shadow:none;border-radius:12px}
.elf-card img{width:auto;display:block;margin:auto auto 0}
.elf-card:hover{background:rgba(56,189,248,.12)}
.elf-card[aria-checked="true"]{border-color:#38BDF8;background:rgba(56,189,248,.18);box-shadow:0 0 14px rgba(56,189,248,.35)}


</style>
</head>

<div>
<button id="btnStart" msgid="elfexpress_start"></button>
<button class="ghost" id="btnTut" msgid="elfexpress_how_to_play"></button>
</div>

function drawBackdrop(g2) {

g2.fillRect(x0, y0, x1 - x0, y1 - y0);
g2.save();
g2.fillStyle = "#FFFFFF";
g2.globalAlpha = 0.9;
for (const [sx, sy, sr] of STARS_BG) {

g2.restore();

      b.innerHTML = '<img alt="" style="height:' + Math.round(d.front.h / 606 * 100) + '%;margin-top:auto" src="' + d.front.src + '">';
      b.style.display = "flex"; b.style.flexDirection = "column";
      b.addEventListener("click", () => selectElf(box, i, true));
      b.addEventListener("keydown", ev => {
        if (ev.key === "ArrowRight" || ev.key === "ArrowDown") {
          ev.preventDefault(); selectElf(box, i + 1, true);
        } else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") {
          ev.preventDefault(); selectElf(box, i - 1, true);
        } else if (ev.key === "Enter") {
          ev.preventDefault(); b.blur(); start();
        }
      });
      box.appendChild(b);
    });
  });
}

function makeSnow() {
return Array.from({ length: 450 }, (_, i) => {
const isLarge = i % 8 === 0;
const isCrystal = i % 18 === 0;
const r = isLarge ? 2.6 + Math.random() * 2.4 : 1.2 + Math.random() * 1.8;
return {
x: -300 + Math.random() * (W + 600), y: -80 + Math.random() * (H + 160), r,
vy: 52 + r * 28 + Math.random() * 28,
sw: 0.8 + Math.random() * 1.8, ph: Math.random() * 6.28,
a: 0.5 + Math.random() * 0.5,
crystal: isCrystal,
large: isLarge
};
});
}

function reportScore() {
if (!S) return;
api.score({
score: S.score,
level: Math.min(S.sleighsDone + 1, SLEIGHS.length),
maxLevel: SLEIGHS.length
});
}

function newGame() {
S = {
mode: "play", t: 0, score: 0, combo: 0,
sleighsDone: 0, inSleigh: 0, recycled: 0, missed: 0, misfiled: 0,
spawnTimer: 1.0, gifts: [], fx: [], nextId: 1, recent: [],
shake: 0, catchFlash: 0,
machFlash: [0,0,0,0,0], machOk: [false,false,false,false,false],
snow: makeSnow(), snowAmt: 0, snowDepth: 0,
gustT: 0, gustX: 0, gustTimer: 3.0,
hint: 0, floorPulse: [0,0,0,0,0], beltPulse: [0,0,0,0,0],
catDual: [false,false,false,false,false], catPop: [0,0,0,0,0],
revealT: 0, revealed: false,
actionEdge: false, actionHeld: false, actionBuf: 0,
skin: SKIN_TONES[Math.floor(Math.random() * SKIN_TONES.length)],
elf: { x: DROP_CX, y: GROUND_Y, floor: 0, climbing: false, climbTo: null, climbPause: 0, facing: 1, carrying: null, bob: 0 },

takeoff: 0, hitchT: 0, stars: 0, won: false,

}))
};
reportScore();
}

const wave = () => WAVES[Math.min(S.sleighsDone, WAVES.length - 1)];
const activeFloors = () => S.tut ? (S.tutTreats ? 3 : 2) : wave().floors;
const interval = () => wave().interval;
const teeterLen = g => S.tut ? 1e9 : TUNE.teeterTime + (g && g.gusted ? GUST.teeterBonus : 0);
const sleighTarget = () => S.tut ? 2 : SLEIGHS[Math.min(S.sleighsDone, SLEIGHS.length - 1)];

const isFinale = () => S.sleighsDone === SLEIGHS.length - 1;
function snowTarget() {
let a = 0;
for (const s of SNOW) if (S.sleighsDone >= s.at) a = s.fall;
return a;
}

function pickCategory() {
const base = wave().weights;
const w = base.slice(), h = S.recent, n = h.length;
for (let i = 0; i < w.length; i++) {
if (!w[i]) continue;
if (n >= 2 && h[n-1] === i && h[n-2] === i) w[i] *= 0.10;
else if (n >= 1 && h[n-1] === i) w[i] *= 0.45;
}
let tot = 0; for (const v of w) tot += v;
if (tot <= 0) return base.findIndex(v => v > 0);
let r = Math.random() * tot;
for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; }
return 0;
}

function spawnGift() {
if (S.tut) return;
const cat = pickCategory();
S.recent.push(cat); if (S.recent.length > 4) S.recent.shift();
const n = activeFloors();
const belt = Math.floor(Math.random() * n);
const v = (S.revealed && Math.random() < 0.5) ? 1 : 0;
S.gifts.push({
id: S.nextId++, cat, v, belt, state: "belt",
x: -30, y: beltY(belt) - GIFT_R,
timer: 0, wrapped: false, tilt: 0, spin: 0, gusted: false,
path: null, seg: 0, p: 0, speed: 0, dropFloor: -1, ductFloor: -1
});
}

/* -------------------------------------------------------------- gift logic */
function updateGifts(dt) {
const teetering = [];
for (const g of S.gifts) if (g.state === "teeter") teetering[g.belt] = g;

for (const g of S.gifts) {
switch (g.state) {
case "belt": {
let limit = teetering[g.belt] ? TEETER_X - 40 : TEETER_X;
for (const o of S.gifts) {
if (o !== g && o.belt === g.belt && (o.state === "belt" || o.state === "teeter") &&
o.x > g.x && o.x - g.x < 200) limit = Math.min(limit, o.x - 40);
}
const blown = S.gustT > 0 && g.x < gustFront();
if (blown) g.gusted = true;
g.tilt = blown ? 0.16 : 0;
g.x = Math.min(g.x + 165 * (blown ? GUST.beltMul : 1) * dt, limit);
if (!teetering[g.belt] && g.x >= TEETER_X - 0.5) {
g.state = "teeter"; g.timer = 0; teetering[g.belt] = g;
}
break;
}
case "teeter": {
g.timer += dt;
const len = teeterLen(g), k = Math.min(g.timer / len, 1);
g.tilt = reduceMotion ? 0
: Math.sin(g.timer * (3 + 11*k*k) * Math.PI) * (0.06 + 0.30*k*k);
if (g.timer >= len) { g.state = "falling"; g.timer = 0; g.tilt = 0; }
break;
}
case "falling": {
g.timer += dt;
const k = g.timer / TUNE.fallTime;
const y0 = beltY(g.belt) - GIFT_R, y1 = carryY(g.belt);
g.x = TEETER_X + 16 * k;
g.y = y0 + (y1 - y0) * k * k;
if (g.timer >= TUNE.fallTime) {
g.state = "landed"; g.y = feetY(g.belt) - 14;
S.missed++; breakCombo();
api.play("pd_item_miss");
}
break;
}
case "carried": {
const e = S.elf;
g.x = e.x + e.facing * 18;
g.y = e.y - CARRY_OFF + Math.sin(e.bob) * 2;
break;
}
case "landed": {
g.x += 230 * dt; g.spin += dt * 5;
if (g.x >= BUILD_X1 - 14) {
g.state = "toStation"; g.spin = 0;
g.ductFloor = g.belt; g.dropFloor = -1;
pathTo(g, [{ x: MACH_CX, y: chuteY(g.belt) }], LINE_SPEED * 0.85);
}
break;
}
default: updateTransit(g, dt);
}
}
S.gifts = S.gifts.filter(g => g.state !== "done");
}

function pathTo(g, pts, speed) {
g.path = [{ x: g.x, y: g.y }].concat(pts);
g.seg = 0; g.p = 0; g.speed = speed;
}

function stepPath(g, dt) {
let move = g.speed * dt;
while (move > 0 && g.seg < g.path.length - 1) {
const a = g.path[g.seg], b = g.path[g.seg + 1];
const len = Math.hypot(b.x - a.x, b.y - a.y) || 0.001;
const rem = len * (1 - g.p);
if (move < rem) { g.p += move / len; move = 0; }
else { move -= rem; g.seg++; g.p = 0; }
}
if (g.seg >= g.path.length - 1) {
const last = g.path[g.path.length - 1];
g.x = last.x; g.y = last.y; return true;
}
const a = g.path[g.seg], b = g.path[g.seg + 1];
g.x = a.x + (b.x - a.x) * g.p;
g.y = a.y + (b.y - a.y) * g.p;
return false;
}

function updateTransit(g, dt) {
if (g.state === "wrapping" || g.state === "rejecting") {
g.timer += dt;
const hold = g.state === "wrapping" ? 0.40 : 0.26;
if (g.state === "wrapping" && g.timer >= hold * 0.5) g.wrapped = true;
if (g.timer >= hold) {
const cy = chuteY(g.ductFloor);
if (g.state === "wrapping") {
g.state = "toSleigh";
pathTo(g, [{ x: WRAP_X, y: cy },
{ x: WRAP_X, y: SLEIGH_Y - 52 },
{ x: SLEIGH_X - 20 + Math.random()*40, y: SLEIGH_Y - 12 }], LINE_SPEED);
} else {
g.state = "toBin";
pathTo(g, [{ x: SPINE_X, y: BIN_Y - 30 },
{ x: BIN_X + (Math.random()*16 - 8), y: BIN_Y - 6 }], LINE_SPEED);
}
}
return;
}

if (g.state === "toBin") g.spin += dt * 4;
if (!stepPath(g, dt)) return;

if (g.state === "toStation") {
const ok = g.dropFloor === g.cat;
g.state = ok ? "wrapping" : "rejecting";
g.timer = 0;
S.machFlash[g.ductFloor] = 0.42; S.machOk[g.ductFloor] = ok;
} else if (g.state === "toSleigh") {
g.state = "done"; landInSleigh();
} else if (g.state === "toBin") {
g.state = "done"; S.recycled++;
if (tutGo() === "bin") tutNext();
puff(BIN_X, BIN_Y - 10, "#FF3333", 10);
checkLoss();
}
}

/* --------------------------------------------------------------- outcomes */
function catchable(forgiving) {
const e = S.elf;
if (e.carrying || e.climbing) return null;
const minX = forgiving ? BUILD_X0 : DROP_X0 - 28;
const maxX = forgiving ? LADDER_CX + 16 : DROP_X1 + 32;
if (e.x < minX || e.x > maxX) return null;
return S.gifts.find(g => g.belt === e.floor &&
(g.state === "teeter" || g.state === "falling" ||
(g.state === "belt" && g.x >= (forgiving ? BUILD_X0 + 10 : TEETER_X - 45)) ||
(g.state === "landed" && (forgiving ? g.x <= BUILD_X1 - 24 : Math.abs(g.x - e.x) <= 56)))) || null;
}
const atChute = () => !S.elf.climbing && S.elf.x >= LADDER_CX - 16;

function doAction(edge, manual) {
if (!S || (S.mode !== "play" && S.mode !== "hitch")) return;
const e = S.elf;
if (e.carrying) {
if (atChute()) {
if (e.x < CHUTE_BX - 18) { e.x = CHUTE_BX - 12; e.facing = 1; }
if (releaseGift()) { S.actionBuf = 0; S.actionHeld = false; }
} else if (edge && manual && !e.climbing && !S.keys.left) {
if (!S.tut || (tutGo() === "chute" && e.floor === (TUT[S.tut - 1] || {}).f)) {
S.cmd = { type: "chute", floor: e.floor }; S.queue = null; S.actionBuf = 0;
}
}
return;
}
if (S.tut && tutGo() !== "belt") return;
const g = catchable(manual);
if (!g) {
if (edge && manual && !e.climbing && e.x > DROP_X1 + 24 && !S.keys.right) {
if (!S.tut || (tutGo() === "belt" && e.floor === (TUT[S.tut - 1] || {}).f)) {
S.cmd = { type: "belt", floor: e.floor }; S.queue = null; S.actionBuf = 0;
}
}
return;
}
if (manual && (e.x < DROP_X0 || e.x > DROP_X1)) {
e.x = Math.max(DROP_X0, Math.min(DROP_X1, e.x));
}
g.state = "carried"; g.tilt = 0; g.timer = 0; g.spin = 0;
e.carrying = g;
S.actionBuf = 0; S.actionHeld = false;
api.play("pd_player_present_pickup");
if (tutGo() === "belt") tutNext();
S.cmd = S.queue || null; S.queue = null;
S.catchFlash = 0.3;
S.beltPulse[e.floor] = 0.5;
puff(e.x, carryY(e.floor), "#FF7733", 10);
}

function releaseGift() {
const e = S.elf;
if (!e.carrying || e.climbing || e.x < LADDER_CX - 16) return false;
if (S.tut && (tutGo() !== "chute" || e.floor !== (TUT[S.tut - 1] || {}).f)) return false;
const g = e.carrying;
e.carrying = null;
g.dropFloor = e.floor; g.ductFloor = e.floor;
g.state = "toStation"; g.tilt = 0; g.spin = 0;
const cy = chuteY(e.floor);
pathTo(g, [{ x: Math.max(g.x, CHUTE_CX), y: cy }, { x: MACH_CX, y: cy }], LINE_SPEED);
if (e.floor === g.cat) {
api.play("pd_player_present_pickup");
S.combo++;
const m = Math.min(1 + Math.floor(S.combo / TUNE.comboStep), TUNE.comboMax);
S.score += TUNE.basePoints * m;
reportScore();
S.floorPulse[e.floor] = 0.5;
puff(CHUTE_CX, chuteY(e.floor), CATS[e.floor].color, 10);
} else {
api.play("pd_item_miss");
S.misfiled++; breakCombo();
puff(CHUTE_CX, chuteY(e.floor), "#FF3333", 8);
}
if (tutGo() === "chute") tutNext();
return true;
}

function landInSleigh() {
if (S.mode !== "play") return;
if (tutGo() === "sleigh") tutNext();
S.inSleigh++;
if (S.inSleigh < sleighTarget()) return;
S.inSleigh = 0; S.sleighsDone++;
api.play("pd_player_level_up");
if (tutGo() === "done") tutNext();
S.score += TUNE.sleighBonus * S.sleighsDone;
reportScore();
if (!reduceMotion) S.shake = 0.32;
puff(SLEIGH_X, SLEIGH_Y - 18, "#FFE14D", 22);
puff(SLEIGH_X, SLEIGH_Y - 18, "#32A658", 18);
say(msgSleighAway(S.sleighsDone, SLEIGHS.length));
if (S.sleighsDone === 4 && !S.revealed && !S.tut) {
S.revealed = true;
S.revealT = 2.6;
S.actionHeld = false; S.actionEdge = false; S.actionBuf = 0;
say(REVEAL_BANNER);
for (let i = 0; i < 5; i++) {
S.catDual[i] = true;
S.catPop[i] = 2.6;
S.floorPulse[i] = 2.6;
puff(CHUTE_BX + 56, chuteY(i), CATS[i].color, 14);
}
}
if (S.sleighsDone >= SLEIGHS.length) {
api.play("game_hurry_up_end");
S.mode = "hitch"; S.hitchT = 0;
say(_msg`elfexpress_sr_all_sleighs`);
}
else if (isFinale()) {
api.play("game_hurry_up");
say(_msg`elfexpress_sr_last_sleigh`);
}
}

function breakCombo() {
S.combo = 0;
if (!reduceMotion) S.shake = Math.max(S.shake, 0.14);
}
function checkLoss() {
if (S.mode === "play" && !S.tut && S.recycled >= TUNE.recycleLimit) endRun(false);
}

/* -------------------------------------------------------------------- elf */
function moveX(e, tx, dt) {
const d = tx - e.x, step = TUNE.runSpeed * dt;
if (Math.abs(d) <= step) e.x = tx;
else { e.x += Math.sign(d) * step; e.facing = Math.sign(d); }
e.x = Math.max(ELF_MIN_X, Math.min(ELF_MAX_X, e.x));
e.bob += dt * 15;
}

function stepTo(e, tf, tx, dt) {
if (e.climbing || e.floor !== tf) {
const wantY = feetY(tf);
if (!e.climbing && Math.abs(e.x - LADDER_CX) > 4) { moveX(e, LADDER_CX, dt); return false; }
e.climbing = true;
e.x += (LADDER_CX - e.x) * Math.min(1, dt * 16);
const dir = e.y > wantY ? -1 : 1;
e.y += dir * TUNE.climbSpeed * dt;
e.bob += dt * 14;
if ((dir < 0 && e.y <= wantY) || (dir > 0 && e.y >= wantY)) {
e.y = wantY; e.floor = tf; e.climbing = false;
}
return false;
}
e.y = feetY(tf);
if (Math.abs(e.x - tx) > 5) { moveX(e, tx, dt); return false; }
e.bob = 0;
return true;
}

function updateElf(dt) {
if (S.tut && tutGo() !== "belt" && tutGo() !== "chute") clearKeys();
const e = S.elf, k = S.keys, maxF = activeFloors() - 1;
if (e.climbPause > 0) e.climbPause = Math.max(0, e.climbPause - dt);
let mx = 0, my = 0;
if (k.left) mx--; if (k.right) mx++; if (k.up) my--; if (k.down) my++;

if (mx || my) {
if (e.climbing && e.climbTo === null) {
let near = S.cmd ? S.cmd.floor : e.floor, best = 1e9;
if (!S.cmd) {
for (let f = 0; f <= maxF; f++) {
const d = Math.abs(e.y - feetY(f));
if (d < best) { best = d; near = f; }
}
}
e.climbTo = near;
}
S.cmd = null; S.queue = null;
}

if (my && e.climbTo === null && !e.climbing && !(e.climbPause > 0)) {
const dir = my < 0 ? 1 : -1;
const nextF = Math.max(0, Math.min(maxF, e.floor + dir));
if (nextF !== e.floor) e.climbTo = nextF;
}

if (e.climbTo !== null) {
const tf = Math.max(0, Math.min(maxF, e.climbTo));
e.climbTo = tf;
if (tf === e.floor && !e.climbing) {
e.climbTo = null;
} else {
if (!e.climbing) {
if (Math.abs(e.x - LADDER_CX) > 4) {
moveX(e, LADDER_CX, dt);
return;
}
e.x = LADDER_CX;
e.climbing = true;
}
if (!my && mx && Math.abs(e.y - feetY(e.climbTo)) <= 20) {
e.y = feetY(e.climbTo);
e.floor = e.climbTo;
e.climbing = false;
e.climbTo = null;
e.climbPause = 0;
moveX(e, e.x + mx * 1000, dt);
if (!e.carrying) doAction(false, false);
else if (mx > 0 && e.x >= CHUTE_BX + 18) releaseGift();
return;
}
e.x += (LADDER_CX - e.x) * Math.min(1, dt * 16);
let rem = TUNE.climbSpeed * dt;
while (rem > 0 && e.climbing) {
const wantY = feetY(e.climbTo);
const dy = wantY - e.y;
if (Math.abs(dy) <= rem) {
rem -= Math.abs(dy);
e.y = wantY;
e.floor = e.climbTo;
e.climbing = false;
e.climbTo = null;
e.climbPause = 0.11;
} else {
e.y += Math.sign(dy) * rem;
rem = 0;
}
}
e.bob += dt * 14;
if (!e.climbing && mx) {
e.climbPause = 0;
moveX(e, e.x + mx * 1000, dt);
if (!e.carrying) doAction(false, false);
else if (mx > 0 && e.x >= CHUTE_BX + 18) releaseGift();
}
return;
}
}

if (mx) {
e.y = feetY(e.floor);
e.climbPause = 0;
moveX(e, e.x + mx * 1000, dt);
if (!e.carrying) doAction(false, false);
else if (mx > 0 && e.x >= CHUTE_BX + 18) releaseGift();
return;
}

const idleCatch = () => { if (!e.carrying) doAction(false, false); };

if (S.cmd) {
if (S.cmd.floor >= activeFloors()) { S.cmd = null; return; }
const tx = S.cmd.type === "belt" ? DROP_CX : CHUTE_CX;
if (stepTo(e, S.cmd.floor, tx, dt)) {
if (S.cmd.type === "chute") {
if (e.carrying) releaseGift();
S.cmd = S.queue || null; S.queue = null;
} else {
idleCatch();
}
}
return;
}
e.bob = 0;
idleCatch();
}

/* -------------------------------------------------------------- particles */
function puff(x, y, color, n) {
if (reduceMotion) return;
for (let i = 0; i < n; i++) S.fx.push({
x, y, color, vx: (Math.random()-.5)*210, vy: -Math.random()*150-28,
life: .5 + Math.random()*.32, age: 0, r: 2.4 + Math.random()*3.2,
star: Math.random() > .45
});
}
function updateFx(dt) {
for (const p of S.fx) { p.age += dt; p.vy += 470*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
S.fx = S.fx.filter(p => p.age < p.life);
}

/* ------------------------------------------------------------------- snow */
function updateSnow(dt) {
S.snowAmt += (snowTarget() - S.snowAmt) * Math.min(1, dt * 0.7);
S.snowDepth = Math.min(1, S.snowDepth + S.snowAmt * SNOW_PILE * dt);

if (S.gustT > 0) {
S.gustT -= dt;
S.gustX += (W + 420) / GUST.dur * dt;
} else if (S.sleighsDone >= GUST.fromSleigh) {
S.gustTimer -= dt;
if (S.gustTimer <= 0) {
S.gustT = GUST.dur; S.gustX = -220;
S.gustTimer = gustGap();
if (!reduceMotion) S.shake = Math.max(S.shake, 0.18);
say(_msg`elfexpress_sr_gust`);
}
}

if (S.snowAmt < 0.01 || reduceMotion) return;
const gust = S.gustT > 0 ? 300 : 0;
const fall = 0.75 + 0.5 * S.snowAmt;
for (const s of S.snow) {
s.y += s.vy * dt * fall;
s.x += Math.sin(S.t * s.sw + s.ph) * 16 * dt + (16 * S.snowAmt + gust) * dt;
if (s.y > Math.max(H, viewY1) + 6) { s.y = Math.min(0, viewY0) - 8; s.x = viewX0 + Math.random() * (viewX1 - viewX0); }
if (s.x > Math.max(W, viewX1) + 6) s.x = Math.min(0, viewX0) - 6;
}
}

function drawSnow(g2) {
if (S.snowAmt < 0.01) return;
g2.save();
const n = Math.min(S.snow.length, Math.round(S.snow.length * (0.12 + S.snowAmt * 0.36)));
for (let i = 0; i < n; i++) {
const s = S.snow[i];
const alpha = Math.min(1, s.a * (0.55 + S.snowAmt * 0.45));
g2.globalAlpha = alpha;
if (s.crystal && s.r > 2.2) {
g2.strokeStyle = "#FFFFFF";
g2.lineWidth = 1.3;
g2.lineCap = "round";
g2.beginPath();
g2.moveTo(s.x - s.r, s.y); g2.lineTo(s.x + s.r, s.y);
g2.moveTo(s.x, s.y - s.r); g2.lineTo(s.x, s.y + s.r);
const d = s.r * 0.65;
g2.moveTo(s.x - d, s.y - d); g2.lineTo(s.x + d, s.y + d);

function drawWind(g2, g) {
if (g.state === "belt" && g.x < 18) return;
const k = 1 - Math.abs(S.gustT / GUST.dur - 0.5) * 2;
g2.save(); g2.lineCap = "round";
for (let i = 0; i < 7; i++) {
const off = (i - 3) * 6.5;
const ph = (S.t * 2.4 + i * 0.31) % 1;
const taper = 1 - Math.abs(off) / 22;
const len = (14 + 34 * taper) * (0.6 + 0.4 * Math.sin(S.t * 9 + i));
const x = g.x - 20 - ph * 20;
g2.globalAlpha = 0.85 * k * taper * (1 - ph * 0.55);
g2.strokeStyle = i % 3 ? "#C1E8ED" : "#FFFFFF";
g2.lineWidth = 1 + 2 * taper;
g2.beginPath();
g2.moveTo(x - len, g.y + off + Math.sin(S.t * 7 + i * 1.4) * 2);
g2.lineTo(x, g.y + off * 0.75);
g2.stroke();
}
g2.fillStyle = "#FFFFFF";
for (let i = 0; i < 6; i++) {
const ph = (S.t * 1.9 + i * 0.17) % 1;
g2.globalAlpha = k * (1 - ph) * 0.95;
g2.beginPath();
g2.arc(g.x - 46 + ph * 58, g.y - 15 + i * 6 + Math.sin(S.t * 8 + i * 2) * 4,
1.5 + (i % 2), 0, 7);
g2.fill();
}
g2.restore();
}

function drawGust(g2) {
if (S.gustT <= 0 || reduceMotion) return;
const front = gustFront();
const k = Math.min(1, S.gustT / (GUST.dur * 0.4));
g2.save(); g2.lineCap = "round";
for (let i = 0; i < 64; i++) {
const y = (i * 149) % (H - 20) + 10;
const len = 60 + (i % 5) * 44;
const x = ((S.t * 800 + i * 97) % (W + 520)) - 260;
if (x > front) continue;
const near = Math.max(0, 1 - (front - x) / 400);
g2.globalAlpha = 0.85 * k * (0.2 + near * 0.8);
g2.strokeStyle = i % 4 ? "#C1E8ED" : "#FFFFFF";
g2.lineWidth = 2 + (i % 3) * 1.4;
g2.beginPath(); g2.moveTo(x - len, y); g2.lineTo(x, y + 2); g2.stroke();
}
if (front < W + 60) {
const gl = g2.createLinearGradient(front - 100, 0, front + 8, 0);
gl.addColorStop(0, "rgba(224,242,254,0)");
gl.addColorStop(1, "rgba(255,255,255,.7)");
g2.globalAlpha = 0.55 * k;
g2.fillStyle = gl; g2.fillRect(front - 100, 0, 108, H);
}
g2.globalAlpha = 0.12 * k; g2.fillStyle = "#BFDBFE"; g2.fillRect(viewX0 - 40, viewY0 - 40, (viewX1 - viewX0) + 80, (viewY1 - viewY0) + 80);
g2.restore();
}

function drawDrift(g2, x0, x1, y, depth, lumpy) {
if (depth < .04) return;
const h = 3 + depth * 24;
g2.save();
g2.beginPath();
g2.moveTo(x0, y + 3);
if (lumpy) {
const n = Math.max(3, Math.round((x1 - x0) / 78));
let lx = x0, ly = y - h * 0.55;
g2.lineTo(lx, ly);
for (let i = 1; i <= n; i++) {
const t = i / n, xx = x0 + (x1 - x0) * t;
const yy = y - h * (0.5 + 0.5 * Math.abs(Math.sin(i * 2.3 + 0.7)));
g2.quadraticCurveTo((lx + xx) / 2, Math.min(ly, yy) - h * 0.3, xx, yy);
lx = xx; ly = yy;
}
} else {
const r = Math.min(h * 0.85, (x1 - x0) / 2.2);
g2.lineTo(x0, y - h + r);
g2.quadraticCurveTo(x0, y - h, x0 + r, y - h);
g2.lineTo(x1 - r, y - h);
g2.quadraticCurveTo(x1, y - h, x1, y - h + r);
}
g2.lineTo(x1, y + 3);
g2.closePath();
g2.fillStyle = "#FFFFFF"; g2.globalAlpha = .94; g2.fill();
g2.globalAlpha = .28; g2.fillStyle = "#6BB4FD";
g2.fill();
g2.restore();
}

function drawGift(g2, g) {
g2.save();
if (g.state === "belt" && g.x < 44) { g2.beginPath(); g2.rect(18, 0, W, H); g2.clip(); }
g2.translate(g.x, g.y);
if (g.tilt) g2.rotate(g.tilt);
if (g.spin && (g.state === "toBin" || g.state === "landed")) g2.rotate(Math.sin(g.spin)*.28);

function drawElf(g2, e) {
  const d = ELVES[elfChoice] || ELVES[0];
  const pics = ELF_IMG[elfChoice] || ELF_IMG[0];
  const moving = e.bob !== 0 || e.climbing;
  const im = moving ? pics.side : pics.front;
  if (!im.complete || !im.naturalWidth) return;
  const v = moving ? d.side : d.front;
  const k = Math.min(ELF_H / d.front.h, 50 / d.front.w);
  const w = v.w * k, h = v.h * k;
  const hop = e.climbing ? -Math.abs(Math.sin(e.bob)) * 2 : (moving ? -Math.abs(Math.sin(e.bob)) * 3 : 0);
  g2.save();
  g2.translate(e.x, e.y + hop);
  if (moving && e.facing < 0) g2.scale(-1, 1);
  g2.drawImage(im, -w / 2, -h, w, h);
  g2.restore();
}

function drawWorkshop(g2) {
const floors = activeFloors();

/* the building itself lives in the painted background; only the snow that
accumulates on the roof is drawn live */
if (S.snowDepth > .01) {
g2.save(); g2.globalAlpha = .95;
g2.strokeStyle = "#FFFFFF"; g2.lineWidth = 8 + S.snowDepth * 15;
g2.lineJoin = "round"; g2.lineCap = "round";
g2.beginPath();
g2.moveTo(BUILD_X0-22, feetY(4)-FLOOR_H);
g2.lineTo((BUILD_X0+BUILD_X1)/2, feetY(4)-FLOOR_H-48);
g2.lineTo(BUILD_X1+22, feetY(4)-FLOOR_H);
g2.stroke(); g2.restore();
}

const carrying = !!S.elf.carrying;

for (let f = 0; f < 5; f++) {
const y = feetY(f), open = f < floors;

if (!open) {
g2.fillStyle = "rgba(185,189,195,.58)";
g2.fillRect(BUILD_X0+2, y-FLOOR_H+2, BUILD_X1-BUILD_X0-4, FLOOR_H-4);
const lby = chuteY(f) - CHUTE_BH/2;
g2.fillStyle = "#FFFFFF"; g2.strokeStyle = "#74797E"; g2.lineWidth = 2;
g2.beginPath(); g2.roundRect(CHUTE_BX, lby, CHUTE_BW, CHUTE_BH, 13); g2.fill(); g2.stroke();
drawPadlock(g2, CHUTE_BX + 28, lby + CHUTE_BH/2, 1.1);
g2.fillStyle = "#1D1D1D"; g2.textAlign = "left";
drawFitText(g2, OPENS_AT_LABELS[f], CHUTE_BX + 50, lby + CHUTE_BH/2 + 4, 146, 12, 9);
continue;
}

/* --- left half: pick-up zone --- */
const beltSel = S.cmd && S.cmd.type === "belt" && S.cmd.floor === f;
const beltQ = S.queue && S.queue.type === "belt" && S.queue.floor === f;
const liveHere = !carrying && S.gifts.some(g => g.belt === f &&
(g.state === "belt" || g.state === "teeter" || g.state === "falling"));
if (beltSel || S.beltPulse[f] > 0) {
g2.fillStyle = beltSel ? "rgba(43,127,217,.16)" : "rgba(42,157,92,.16)";
g2.beginPath(); g2.roundRect(BUILD_X0+6, y-FLOOR_H+6, TAP_SPLIT-BUILD_X0-14, FLOOR_H-12, 10);
g2.fill();
}
if (beltSel || (liveHere && !carrying)) {
g2.strokeStyle = beltSel ? "#3399FF"
: "rgba(43,127,217," + (reduceMotion ? 0.55 : (0.32 + 0.38*Math.abs(Math.sin(S.t*3.5)))) + ")";
g2.lineWidth = beltSel ? 3 : 2.4;
g2.beginPath(); g2.roundRect(BUILD_X0+6, y-FLOOR_H+6, TAP_SPLIT-BUILD_X0-14, FLOOR_H-12, 10);
g2.stroke();
}
if (beltQ) {
g2.strokeStyle = "#32A658"; g2.lineWidth = 2.6; g2.setLineDash([8,6]);
g2.beginPath(); g2.roundRect(BUILD_X0+4, y-FLOOR_H+4, TAP_SPLIT-BUILD_X0-10, FLOOR_H-8, 12);
g2.stroke(); g2.setLineDash([]);
}

drawFloorBelt(g2, f);

const liveDrop = S.gifts.some(g => g.belt === f && (g.state === "teeter" || g.state === "falling"));
if (liveDrop) {
g2.strokeStyle = "#1B69C1";
g2.lineWidth = 2.6;
g2.setLineDash([6,5]);
g2.strokeRect(DROP_X0, y - 56, DROP_X1 - DROP_X0, 56);
g2.setLineDash([]);
}

/* --- right half: chute (painted panel underneath, states drawn here) --- */
const sel = S.cmd && S.cmd.type === "chute" && S.cmd.floor === f;
const q = S.queue && S.queue.type === "chute" && S.queue.floor === f;
const cyy = chuteY(f), by2 = cyy - CHUTE_BH/2;
const cat = CATS[f], pulse = S.floorPulse[f];
const popT = S.catPop ? S.catPop[f] : 0;
const popDur = S.tut ? 1.4 : 2.6;
const popElapsed = Math.max(0, popDur - popT);
const blink = !reduceMotion && popT > 0 && Math.sin(popElapsed * Math.PI * 3.5) > 0;

if (!carrying && !sel && pulse <= 0 && popT <= 0) {
g2.fillStyle = "rgba(255,255,255,.18)";
g2.beginPath(); g2.roundRect(CHUTE_BX, by2, CHUTE_BW, CHUTE_BH, 13); g2.fill();
}
if (sel || pulse > 0 || popT > 0) {
g2.fillStyle = popT > 0 ? (reduceMotion ? "rgba(255,255,255,.45)" : (blink ? "rgba(255,225,77,.45)" : "rgba(255,255,255,.55)"))
: (sel ? "rgba(255,255,255,.28)" : "rgba(255,255,255,.45)");
g2.beginPath(); g2.roundRect(CHUTE_BX, by2, CHUTE_BW, CHUTE_BH, 13); g2.fill();
}
g2.strokeStyle = popT > 0 ? ((reduceMotion || blink) ? "#FFE14D" : "#FFFFFF")
: ((sel || pulse > 0) ? "#FFFFFF" : "rgba(29,29,29,.24)");
g2.lineWidth = (sel || popT > 0) ? 3.5 : 2;
g2.beginPath(); g2.roundRect(CHUTE_BX, by2, CHUTE_BW, CHUTE_BH, 13); g2.stroke();

if (q) {
g2.strokeStyle = "#32A658"; g2.lineWidth = 2.8; g2.setLineDash([8,6]);
g2.beginPath(); g2.roundRect(CHUTE_BX-3, by2-3, CHUTE_BW+6, CHUTE_BH+6, 15);
g2.stroke(); g2.setLineDash([]);
}
if (carrying && !S.cmd) {
g2.strokeStyle = "rgba(255,255,255," + (reduceMotion ? 0.75 : (0.4+0.5*Math.abs(Math.sin(S.t*3.5)))) + ")";
g2.lineWidth = 3;
g2.beginPath(); g2.roundRect(CHUTE_BX-3, by2-3, CHUTE_BW+6, CHUTE_BH+6, 15); g2.stroke();
}

g2.save(); g2.globalAlpha = 1;
const iconY = by2 + CHUTE_BH/2;
if (S.catDual && S.catDual[f]) {
const prog = (popT > 0 && !reduceMotion) ? Math.min(1, popElapsed / 1.4) : 1;
const slide = Math.min(1, prog / 0.28);
const ease = 1 - Math.pow(1 - slide, 3);
const x0 = CHUTE_BX + 32 - 9 * ease;
const s0 = 0.90 - 0.12 * ease;
const x1 = CHUTE_BX + 32 + 24 * ease;
const s1 = prog < 0.24 ? (0.2 + (prog / 0.24) * 0.88)
: prog < 0.65 ? (0.78 + 0.30 * Math.abs(Math.cos((prog - 0.24) / 0.41 * Math.PI))) : 0.78;
drawIconBadge(g2, f, x0, iconY, s0, 0);
if (popT > 0) {
g2.strokeStyle = (reduceMotion || blink) ? "#FFE14D" : "#FFFFFF";
g2.lineWidth = 3;
g2.beginPath(); g2.arc(x1, iconY, (GIFT_R + 5) * s1, 0, 7); g2.stroke();
}
drawIconBadge(g2, f, x1, iconY, s1, 1);
g2.restore();
g2.fillStyle = cat.ink; g2.textAlign = "left";
drawFitText(g2, CAT_UPPER[f], CHUTE_BX + 62 + 16 * ease, cyy + 5, 134 - 16 * ease, 14, 9);
} else {
drawIconBadge(g2, f, CHUTE_BX + 32, iconY, 0.9, 0);
g2.restore();
g2.fillStyle = cat.ink; g2.textAlign = "left";
drawFitText(g2, CAT_UPPER[f], CHUTE_BX + 62, cyy + 5, 134, 14, 9);
}
}
}

}
if (PROPS.sleigh.img.complete) g2.drawImage(PROPS.sleigh.img, sx, sy, sw, sh);

g2.fillStyle = "rgba(255,255,255,.96)"; g2.strokeStyle = "#D92626";
g2.lineWidth = 1.8;
g2.beginPath(); g2.roundRect(SLEIGH_X - 25, SLEIGH_Y + 3, 50, 18, 9);
g2.fill(); g2.stroke();
g2.textAlign = "center"; g2.fillStyle = "#1D1D1D";
g2.font = "bold 13px 'Google Sans',sans-serif";
g2.fillText(S.inSleigh + " / " + tgt, SLEIGH_X, SLEIGH_Y + 16);
const m = Math.min(1 + Math.floor(S.combo / TUNE.comboStep), TUNE.comboMax);
if (m > 1) {
g2.fillStyle = "rgba(255,255,255,.96)"; g2.strokeStyle = "#E7AD03";
g2.lineWidth = 1.8;
g2.beginPath(); g2.roundRect(SLEIGH_X - 25, SLEIGH_Y + 24, 50, 18, 9);
g2.fill(); g2.stroke();
g2.fillStyle = "#E7AD03"; g2.font = "bold 12px 'Google Sans',sans-serif";
g2.fillText("✨ x" + m, SLEIGH_X, SLEIGH_Y + 37);
}
g2.textAlign = "left";
drawReindeer(g2);
}

}
}
}

function takeoffPath(k) {
const e = 1 - Math.pow(1 - Math.min(Math.max(k, 0), 1), 2.2);
return { x: 6 + e * 236, y: 168 - e * 150 };
}

function drawTakeoff(g2, t) {
/* --- sky --- */
const tx0 = viewX0 - 40, ty0 = viewY0 - 40, tw = (viewX1 - viewX0) + 80, th = (viewY1 - viewY0) + 80;
g2.fillStyle = "#3A068D"; g2.fillRect(tx0, ty0, tw, th);
g2.fillStyle = "#4802B8"; g2.fillRect(tx0, 380, tw, 150);
g2.fillStyle = "#2A56AD"; g2.fillRect(tx0, 530, tw, Math.max(170, viewY1 + 40 - 530));

/* --- stars, some twinkling --- */
for (let i = 0; i < 150; i++) {
const x = (i*47 + 13) % CWS, y = (i*29 + 7) % 150;
if (i % 7 === 0) {
const tw = Math.sin(t*3 + i) > 0.2;
if (!tw) continue;
pxs(g2, x, y, 1, 1, "#FFFFFF");
} else pxs(g2, x, y, 1, 1, i % 4 ? "#FFFFFF" : "#9FCEFF");
}

/* --- moon, with sparkles --- */
for (let dy = -MOON_R; dy <= MOON_R; dy++) {
const w = Math.floor(Math.sqrt(MOON_R*MOON_R - dy*dy));
pxs(g2, MOON_X - w, MOON_Y + dy, 2*w, 1, "#FFF8BD");
}
pxs(g2, MOON_X - 6, MOON_Y - 5, 4, 3, "#F9D231");
pxs(g2, MOON_X + 3, MOON_Y + 4, 3, 2, "#F9D231");
pxs(g2, MOON_X + 1, MOON_Y - 8, 2, 2, "#F9D231");
const SPK = [[-19,-11],[17,-14],[21,7],[-16,10],[2,-20],[-6,19]];
for (let i = 0; i < SPK.length; i++) {
const ph = Math.sin(t * 2.4 + i * 1.7);
if (ph < 0.1) continue;
const arm = 1 + Math.round(ph * 2.4);
const sx = MOON_X + SPK[i][0], sy = MOON_Y + SPK[i][1];
const c = i % 2 ? "#FFFFFF" : "#FFF8BD";
pxs(g2, sx - arm, sy, arm*2 + 1, 1, c);
pxs(g2, sx, sy - arm, 1, arm*2 + 1, c);
}

/* --- city --- */
for (let i = 0; i < CITY_FAR.length; i++) {
const b = CITY_FAR[i];
pxs(g2, b[0], GYS - b[2], b[1], b[2], "#4802B8");
pxs(g2, b[0], GYS - b[2], b[1], 1, "#7A037E");
}
for (let i = 0; i < CITY.length; i++) {
const x = CITY[i][0], w = CITY[i][1], h = CITY[i][2], col = CITY[i][3];
const y = GYS - h;
pxs(g2, x, y, w, h, col);
pxs(g2, x, y, w, 2, "#FFFFFF");
for (let ry = y + 5; ry < GYS - 4; ry += 7)
for (let rx = x + 3; rx < x + w - 3; rx += 6) {
const lit = ((rx * 7 + ry * 13 + i) % 5) !== 0;
pxs(g2, rx, ry, 2, 2, lit ? "#FFE14D" : "#4802B8");

}
if (S.tut && tutGo() === "tap") {
if (!ev.repeat) tutNext();
ev.preventDefault();
return;
}
if (!ev.repeat) {
S.actionEdge = true;
S.actionBuf = 0.28;
}
S.actionHeld = true;
ev.preventDefault();
return;
}
}

function onKeyUp(ev) {
if (!S) return;
if (ev.key === " " || ev.code === "Space" || ev.key === "Enter" || ev.keyCode === 32) {
S.actionHeld = false;
ev.preventDefault();
return;
}
const k = KEYMAP[ev.key];
if (k) {
S.keys[k] = false;
ev.preventDefault();
}
}

function bindKeys() {
if (!keysBound) {
window.addEventListener("keydown", onKeyDown);
window.addEventListener("keyup", onKeyUp);
keysBound = true;
}
if (document.activeElement && document.activeElement !== cv && document.activeElement !== document.body) {
document.activeElement.blur();
}
window.focus();
cv.focus({ preventScroll: true });
}

function unbindKeys() {
if (keysBound) {
window.removeEventListener("keydown", onKeyDown);
window.removeEventListener("keyup", onKeyUp);
keysBound = false;
}
if (S) {
clearKeys();
S.actionHeld = false;
S.actionEdge = false;
S.actionBuf = 0;
}
}

window.addEventListener("pagehide", unbindKeys);
window.addEventListener("beforeunload", unbindKeys);
window.addEventListener("blur", () => {
if (S) {
clearKeys();
S.actionHeld = false;
S.actionEdge = false;
S.actionBuf = 0;
}
});

const toGame = ev => {
const r = cv.getBoundingClientRect();
return { x: (ev.clientX - r.left - offsetX) / scale, y: (ev.clientY - r.top - offsetY) / scale };
};

function tapTarget(p) {
if (S.revealT > 0) return;
if (S.tut) {
const st = TUT[S.tut - 1];
if (!st) return;
if (st.go === "tap") { tutNext(); return; }
const tf = Math.max(0, Math.min(4, Math.floor((GROUND_Y - p.y) / FLOOR_H)));
const side = p.x < TAP_SPLIT ? "belt" : "chute";
if (!((st.go === "belt" || st.go === "chute") && side === st.go && tf === st.f)) return;
}
let f = Math.floor((GROUND_Y - p.y)/FLOOR_H);
f = Math.max(0, Math.min(4, f));
if (f >= activeFloors()) return;
const t = { type: p.x < TAP_SPLIT ? "belt" : "chute", floor: f };

const carrying = !!S.elf.carrying;
const busy = !!S.cmd;
S.elf.climbTo = null;
if (busy && carrying && t.type === "belt" && S.cmd.type === "chute") {
S.queue = t; clearKeys(); return;
}
if (busy && !carrying && t.type === "chute" && S.cmd.type === "belt") {
S.queue = t; clearKeys(); return;
}
S.cmd = t; S.queue = null; clearKeys();
}

cv.addEventListener("pointerdown", ev => {
if (!S || S.mode !== "play") return;
window.focus();
cv.focus({ preventScroll: true });
tapTarget(toGame(ev)); ev.preventDefault();
}, { passive: false });
cv.addEventListener("contextmenu", ev => ev.preventDefault());

/* =============================================================== SCREENS */
const el = id => document.getElementById(id);
const show = (id, on) => el(id).classList.toggle("on", on);
const say = m => { el("sr").textContent = m; };

function startTakeoff() {
S.mode = "takeoff"; S.takeoff = 0;
S.stars = S.recycled <= TUNE.starGood ? 3 : S.recycled <= TUNE.starOk ? 2 : 1;
api.play("pd_player_level_up");
say(_msg`elfexpress_sr_win`);
}

function endRun(won) {
if (S.mode === "over") return;
S.mode = "over";
S.won = won;
unbindKeys();
reportScore();
api.play("game_hurry_up_end");
if (won) {
api.play("qd_complete");
api.play("music_start_scene");
} else {
api.play("music_ingame_gameover");
api.play("pd_game_over");
}
api.gameover();
}

function start() {
newGame();
api.play("game_hurry_up_end");
api.play("music_start_ingame");
if (document.activeElement && document.activeElement !== cv && document.activeElement !== document.body) {
document.activeElement.blur();
}
show("scrTitle", false);
show("btnSkipTut", false);
bindKeys();
last = 0;
if (!raf) raf = requestAnimationFrame(frame);
}

function tutGift(cat) {
S.gifts.push({ id: S.nextId++, cat, v: 0, belt: 0, state: "belt", x: -30, y: beltY(0) - GIFT_R, timer: 0, wrapped: false, tilt: 0, spin: 0, gusted: false, path: null, seg: 0, p: 0, speed: 0, dropFloor: -1, ductFloor: -1 });
}
function startTutorial() {
newGame(); S.tut = 0; S.hint = 0;
api.play("game_hurry_up_end");
api.play("music_start_ingame");
S.elf.x = CHUTE_CX; S.elf.facing = -1;
tutGift(1);
if (document.activeElement && document.activeElement !== cv && document.activeElement !== document.body) {
document.activeElement.blur();
}
show("scrTitle", false);
show("btnSkipTut", true);
bindKeys();
tutNext();
last = 0;
if (!raf) raf = requestAnimationFrame(frame);
}
el("btnTut").addEventListener("click", ev => { ev.currentTarget.blur(); startTutorial(); });
el("btnSkipTut").addEventListener("click", ev => { ev.currentTarget.blur(); start(); });
buildElfPicker();
el("btnStart").addEventListener("click", ev => { ev.currentTarget.blur(); start(); });

api.config({
pause: true,
orientation: 'landscape',
});

api.addEventListener('pause', () => {
if (!S) return;
unbindKeys();
if (S.mode === 'play' || S.mode === 'hitch' || S.mode === 'takeoff') {
S.pausedFrom = S.mode;
S.mode = 'pause';
}
});

api.addEventListener('resume', () => {
if (!S) return;
if (S.mode === 'pause') {
S.mode = S.pausedFrom || 'play';
S.pausedFrom = null;
bindKeys();
last = 0;
}
});

api.addEventListener('restart', () => {
start();
});

if (typeof CanvasRenderingContext2D !== "undefined" &&
!CanvasRenderingContext2D.prototype.roundRect) {
CanvasRenderingContext2D.prototype.roundRect = function (x,y,w,h,r) {
r = Math.min(r, w/2, h/2);
this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this;
};
}


fit(); newGame(); S.mode = "idle";
raf = requestAnimationFrame(frame);
api.ready(() => {
api.play("qd_load_sounds");
show("scrTitle", true);
last = 0;
});
</script>
</body>
