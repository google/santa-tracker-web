<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title msgid="scene_elfexpress"></title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" />
  <link rel="stylesheet" href="./index.css" />
</head>
<body>

<div id="stage">
  <canvas id="game" tabindex="-1" aria-label="Elf Express"></canvas>
  <button id="btnSkipTut" class="ghost tut-skip-btn" msgid="elfexpress_skip_tut"></button>

  <div class="screen on" id="scrTitle">
    <div class="panel">
      <h1 msgid="scene_elfexpress"></h1>
      <p class="sub" msgid="elfexpress_pick_elf"></p>
      <div id="elfPicker" class="elf-picker" role="radiogroup" aria-label="Pick your elf"></div>
      <div>
        <button id="btnStart" msgid="elfexpress_start"></button>
        <button class="ghost" id="btnTut" msgid="elfexpress_how_to_play"></button>
      </div>
    </div>
  </div>
</div>
<p class="vis-hidden" role="status" aria-live="polite" id="sr"></p>

<script src="index.js" type="module"></script>

</body>
</html>
